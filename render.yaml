# Paid prototype topology. The four URLs can address separate logical databases
# on one managed PostgreSQL instance; Render cannot create those databases in a
# Blueprint, so DEPLOY.md owns that one-time setup.
# Render environment groups cannot prompt for secret values. Provider and
# object-storage keys are added to this shared group in the dashboard.
services:
  - type: web
    name: case-chat-web
    runtime: docker
    plan: standard
    region: ohio
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    preDeployCommand: ./bin/rails db:prepare
    envVars:
      - fromGroup: case-chat-production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CACHE_DATABASE_URL
        sync: false
      - key: QUEUE_DATABASE_URL
        sync: false
      - key: CABLE_DATABASE_URL
        sync: false
      - key: QUEUE_DB_POOL
        value: "2"

  - type: worker
    name: case-chat-worker
    runtime: docker
    plan: standard
    region: ohio
    autoDeployTrigger: checksPass
    preDeployCommand: ./bin/wait-for-database-preparation
    dockerCommand: ./bin/jobs
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: case-chat-production
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: case-chat-web
          envVarKey: SECRET_KEY_BASE
      - key: DATABASE_URL
        fromService:
          type: web
          name: case-chat-web
          envVarKey: DATABASE_URL
      - key: CACHE_DATABASE_URL
        fromService:
          type: web
          name: case-chat-web
          envVarKey: CACHE_DATABASE_URL
      - key: QUEUE_DATABASE_URL
        fromService:
          type: web
          name: case-chat-web
          envVarKey: QUEUE_DATABASE_URL
      - key: CABLE_DATABASE_URL
        fromService:
          type: web
          name: case-chat-web
          envVarKey: CABLE_DATABASE_URL
      - key: CABLE_DB_POOL
        value: "5"
      - key: QUEUE_DB_POOL
        value: "7"

envVarGroups:
  - name: case-chat-production
    envVars:
      - key: RAILS_ENV
        value: production
      - key: PORT
        value: "80"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: DB_POOL
        value: "5"
      - key: CACHE_DB_POOL
        value: "3"
      - key: CABLE_DB_POOL
        value: "3"
      - key: AI_JOB_THREADS
        value: "5"
      - key: DEFAULT_JOB_THREADS
        value: "2"
      - key: RACK_TIMEOUT_SERVICE_TIMEOUT
        value: "15"
      - key: RAILS_LOG_LEVEL
        value: info
      - key: BUNDLE_WITHOUT
        value: development:test
