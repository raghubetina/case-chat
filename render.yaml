# A TESTING profile, deliberately smaller than the topology this app wants.
#
# Where it is smaller, and what that costs:
#
#   Key Value is back, on free. Free is 25MB and 50 connections, and neither
#   is close to binding: Action Cable memoizes two connections per Rails
#   process — one to publish, one Listener multiplexing every channel — so
#   thirty students streaming is thirty WebSockets to Puma and still one
#   subscriber connection here. Pub/sub stores nothing, so the 25MB has
#   nothing to hold. What free costs is that Render may restart the instance
#   unannounced, dropping messages in flight. A reply survives that: it is
#   persisted before the broadcast that replaces the streaming row, so the
#   worst case is a row stuck on REPLYING until a reload. Move to starter
#   ($10) before a live class, for the restarts rather than the capacity.
#
#   Web is starter (512MB), so WEB_CONCURRENCY stays at one Puma worker. Two
#   would not fit.
#
#   Postgres is basic-256mb, which holds the seeded cases and a few students.
#
# The worker stays a separate service. Folding jobs back into Puma would save
# another instance and change the thing being tested: a reply streams for
# 10-60 seconds and would hold a request thread for all of it.
#
# Restore before a class uses this: standard web, basic-1gb Postgres, and
# starter Key Value.
#
# The Foundation blueprint runs everything in one 512MB web service with Solid
# Queue inside Puma and Action Cable polling Postgres. That is a sound default
# for a small CRUD app and the wrong shape for this one, because Case Chat has
# two demanding characteristics:
#
#   1. A contact's reply is a 10-60 second streaming job. In-Puma Solid Queue
#      would hold a worker inside the web process for that entire time, so a
#      handful of concurrent conversations would starve the request threads
#      that serve everyone else. Hence a dedicated worker service.
#
#   2. Token streaming means many broadcasts per second per active thread.
#      Solid Cable is database-backed and polls, so every subscriber costs a
#      recurring query and every token costs a write. Hence Key Value (Redis)
#      for Action Cable, while Solid Cache and Solid Queue stay on Postgres,
#      where their access patterns are a good fit.
databases:
  - name: case-chat-claude-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "18"

services:
  # Action Cable only. Cache and queue stay on Postgres, where their access
  # patterns fit; this exists because token streaming does not — Solid Cable
  # polls, so the browser could never see an update sooner than one poll
  # interval no matter how fast the model streamed.
  - name: case-chat-claude-cable
    type: keyvalue
    plan: free
    region: ohio
    ipAllowList: [] # reachable only from inside the Render private network
    # Nothing to evict: pub/sub messages are not keys, so this policy never
    # acts. Kept because a queue would want it if this instance is ever reused,
    # not because it protects a stream.
    maxmemoryPolicy: noeviction
  - type: web
    name: case-chat-claude
    runtime: docker
    plan: starter
    region: ohio
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    envVars:
      - fromGroup: case-chat-claude-runtime
      # Secrets set by hand in the dashboard; see the note on the group below.
      - fromGroup: case-chat
      # DATABASE_URL and REDIS_URL sit on each service rather than in the group:
      # fromDatabase and fromService resolve a connection string for a service,
      # and Render rejects them inside an envVarGroup ("must have a key and
      # value") because a group has no service to resolve them against.
      - key: DATABASE_URL
        fromDatabase:
          name: case-chat-claude-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: case-chat-claude-cable
          type: keyvalue
          property: connectionString
      - key: PORT
        value: "80"
      # Standard has room for a real cluster; each worker gets its own threads.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"
      # Web processes no longer run jobs — that is the worker's job now.
      - key: SOLID_QUEUE_IN_PUMA
        value: "false"
      # Per Puma worker: threads plus headroom for Action Cable and Solid Cache.
      - key: DB_POOL
        value: "6"
      # Streaming responses are held open by Action Cable, not by a request, so
      # the ordinary request deadline stays short.
      - key: RACK_TIMEOUT_SERVICE_TIMEOUT
        value: "15"
      # The perimeter throttle counts per client IP, and a seminar room behind
      # one campus NAT is a single IP. 300 per five minutes is a sensible
      # public default and far too low for thirty students working at once.
      - key: RACK_ATTACK_LIMIT
        value: "3000"

  - type: worker
    name: case-chat-claude-worker
    runtime: docker
    # Standard (2GB). Starter's 512MB was not enough: the worker OOMed, which
    # is what a service holding five concurrent streaming replies plus their
    # briefings looks like on half a gig. Changed in the dashboard first — this
    # line is what keeps a blueprint sync from putting it back.
    plan: standard
    region: ohio
    autoDeployTrigger: checksPass
    # Not ./bin/rails server, so the entrypoint's db:prepare does not run here:
    # migrations belong to one process, and that process is the web service.
    dockerCommand: ./bin/jobs
    envVars:
      - fromGroup: case-chat-claude-runtime
      - fromGroup: case-chat
      # DATABASE_URL and REDIS_URL sit on each service rather than in the group:
      # fromDatabase and fromService resolve a connection string for a service,
      # and Render rejects them inside an envVarGroup ("must have a key and
      # value") because a group has no service to resolve them against.
      - key: DATABASE_URL
        fromDatabase:
          name: case-chat-claude-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: case-chat-claude-cable
          type: keyvalue
          property: connectionString
      # A reply job spends most of its life waiting on the model, so threads
      # are cheap here; this is IO-bound, not CPU-bound.
      - key: JOB_CONCURRENCY
        value: "1"
      - key: JOB_THREADS
        value: "5"
      # Solid Queue refuses to boot if the pool cannot cover its threads, and it
      # opens two beyond them — one for the dispatcher, one for the supervisor's
      # heartbeat. Five threads therefore needs seven, and this is eight so the
      # next thread added does not crash-loop the worker.
      - key: DB_POOL
        value: "8"

# Two groups on purpose. This one is the blueprint's: wiring it can derive, and
# values it generates. The other, `case-chat`, is managed by hand in the
# dashboard and holds the secrets: CLOUDINARY_URL and the provider keys. Nothing appears in both, because a key declared twice resolves to
# whichever group is listed last and that is not a thing to leave to ordering.
envVarGroups:
  - name: case-chat-claude-runtime
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: BUNDLE_WITHOUT
        value: development:test
      # Both services must share this or signed cookies and Active Storage
      # URLs minted by one are rejected by the other.
      - key: SECRET_KEY_BASE
        generateValue: true
      # Which model answers as a stakeholder: anthropic | openai.
      #
      # openai because the reply has to read as live typing. Measured on one
      # prompt: OpenAI streams 252 text frames ~13ms apart, Anthropic 12 frames
      # of ~104 characters ~704ms apart, which lands as visible slabs. Both
      # adapters sit behind the same seam, so this is one value to flip — watch
      # the [reply] cache_read lines before settling it.
      - key: RESPONDER
        value: openai
      # Host for mailer links.
      - key: APPLICATION_HOST
        sync: false
      # Load the teaching cases on first boot. Off unless set, because seeding
      # creates sign-in-able demo accounts.
      - key: SEED_DEMO_CASES
        sync: false
      # The passphrase those demo accounts get. Seeding refuses to run in
      # production without it: the default is committed to this repo.
      - key: SEED_PASSWORD
        sync: false
      # Transactional mail stays dormant until both of these are set.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Error reporting. Declared here, rather than left as a key added by hand,
      # so a blueprint sync of this group cannot drop it. Reporting also
      # requires production: a token anywhere else is inert by design.
      - key: ROLLBAR_ACCESS_TOKEN
        sync: false
