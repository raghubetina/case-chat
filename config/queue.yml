default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Reply jobs spend most of their life waiting on the model, so threads are
    # cheap: this is IO-bound, not CPU-bound.
    - queues: "*"
      threads: <%= ENV.fetch("JOB_THREADS", 5) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
