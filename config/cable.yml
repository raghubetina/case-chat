# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

# Token streaming means many broadcasts per second per active thread. Solid
# Cable is database-backed and polls, so each subscriber is a recurring query
# and each token is a write; Redis is the right shape for that traffic. Solid
# Cable stays as the fallback so an environment without REDIS_URL still runs.
production:
  <% if ENV["REDIS_URL"].present? %>
  adapter: redis
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: case_chat_production
  <% else %>
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  <% end %>
